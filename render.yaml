# Render Blueprint — backend servisi bu reponun api/ klasöründen çalışır.
# Docker imajıyla deploy edilir (LibreOffice gerekir: yazdir.js DOCX->PDF).
# Render'da "New > Blueprint" ile bu repo seçilince servis otomatik kurulur;
# sync: false işaretli değerler panelde elle girilir (gizli bilgiler).
# Frontend servisi panelden elle kurulduğu için burada tanımlı değildir.
services:
  - type: web
    name: artidoksan2-api
    runtime: docker
    plan: free
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
